plugins { id 'com.android.application' }
def releaseConfig = new Properties()
def releaseConfigFile = rootProject.file('.release/signing.properties')
if (releaseConfigFile.exists()) releaseConfigFile.withInputStream { releaseConfig.load(it) }
def configValue = { String key -> providers.gradleProperty(key).orElse(providers.environmentVariable(key)).getOrElse('') }
def javaString = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
android {
    namespace 'com.peter.myhealth'
    compileSdk 36
    defaultConfig {
        applicationId 'com.peter.myhealth'; minSdk 29; targetSdk 36; versionCode 6; versionName '2.3.1'
        testInstrumentationRunner 'com.peter.myhealth.IntegrationChecks'
        buildConfigField 'String', 'PLAY_BILLING_PUBLIC_KEY', javaString(configValue('PLAY_BILLING_PUBLIC_KEY'))
        buildConfigField 'String', 'PRIVACY_POLICY_URL', javaString(configValue('PRIVACY_POLICY_URL'))
        buildConfigField 'String', 'SUPPORT_EMAIL', javaString(configValue('SUPPORT_EMAIL'))
        buildConfigField 'String', 'PUBLIC_DEVELOPER_NAME', javaString(configValue('PUBLIC_DEVELOPER_NAME'))
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (releaseConfigFile.exists()) {
            release { storeFile rootProject.file(releaseConfig.getProperty('storeFile')); storePassword System.getenv('MY_HEALTH_STORE_PASSWORD') ?: releaseConfig.getProperty('storePassword',''); keyAlias releaseConfig.getProperty('keyAlias'); keyPassword System.getenv('MY_HEALTH_KEY_PASSWORD') ?: releaseConfig.getProperty('keyPassword','') }
        }
    }
    buildTypes { release { if (releaseConfigFile.exists()) signingConfig signingConfigs.release; minifyEnabled false; debuggable false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.android.billingclient:billing:9.1.0'
}
